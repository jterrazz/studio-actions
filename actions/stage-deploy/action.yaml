name: Stage deploy
description: Hand a Deploy job what it would otherwise read from the registry, the app chart and the image's digest, so a job in a GitHub environment needs no registry account

inputs:
  registry:
    description: Container registry hostname
    default: "registry.internal.jterrazz.com"
  digest:
    description: The digest the built tag points at (build-image's `digest` output)
    required: true
  artifact:
    description: Name of the artifact the chart and the digest are uploaded as; deploy-app reads it back
    required: true

runs:
  using: composite
  steps:
    - name: Set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: "v4.3.1"

    # invariant: the chart is pulled here, beside the image it deploys, by a job connect-infra logged
    # in: the Deploy job runs in a GitHub environment, whose token Infisical does not trust, so it
    # never holds the registry account. The newest chart is pulled, as a Deploy that pulled it
    # itself would have, minutes later.
    - name: Pull the app chart
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        DIGEST: ${{ inputs.digest }}
      run: |
        set -euo pipefail
        # hazard: read from the environment, never interpolated into the script text by an expression.
        printf '%s' "$DOCKER_REGISTRY_PASSWORD" | helm registry login "$REGISTRY" \
          --username "$DOCKER_REGISTRY_USERNAME" --password-stdin
        stage="$RUNNER_TEMP/studio-stage"
        mkdir -p "$stage"
        helm pull "oci://$REGISTRY/charts/app" --destination "$stage"
        # value: no .json here: Summary gathers every artifact and reads its .json files as reports.
        printf '%s\n' "$DIGEST" > "$stage/digest"
        ls "$stage"

    - name: Upload the stage
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/studio-stage
        retention-days: 1
        if-no-files-found: error
